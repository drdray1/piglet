

# ============================================================
# Piglet Wardriver Configuration — XIAO (S3 / C5 / C6)
# Format: key=value
# Lines starting with # are comments and ignored.
# ============================================================


# ------------------------------------------------------------
# WiGLE Upload
# ------------------------------------------------------------
# Use Only the "Encoded for Use" token
# Get it here: https://wigle.net/account
# Leave empty to disable WiGLE uploads.

wigleBasicToken=EnterWigleTokenForUseTokenHere


# ------------------------------------------------------------
# WatchDogGoWars
# ------------------------------------------------------------
# Get your API key here: https://wdgwars.pl/profile/
# Add your API Key Below


wdgwarsApiKey=EnterWatchDogsGoAPITokenHere

# ------------------------------------------------------------
# Max Automatic Uploads at Boot
# ------------------------------------------------------------
# Integer. Caps how many CSVs auto-upload at boot for both WiGLE
# and WatchdogsGoWars.
# -1     = upload ALL pending files every boot
#  0     = disabled, no auto-upload (use the web UI or pull from SD)
#  1-100 = upload up to N files per boot (e.g. 25 → at most 25)

maxBootUploads=-1



# ------------------------------------------------------------
# Home Wi-Fi (STA mode)
# ------------------------------------------------------------
# If provided, device will attempt to connect on boot.
# If connection fails, it falls back to SoftAP for 60 seconds.

homeSsid=EnterWifiHere
homePsk=EnterWifiPasswordHere


# ------------------------------------------------------------
# Wardriver Access Point (SoftAP fallback)
# ------------------------------------------------------------
# SSID and password for the temporary config AP.
# Password must be ≥8 characters or AP becomes open.
wardriverSsid=Piglet-WARDRIVE
wardriverPsk=wardrive1234


# ------------------------------------------------------------
# GPS Settings
# ------------------------------------------------------------
# UART baud rate for the GPS module.
# Common values: 9600, 38400, 115200
gpsBaud=9600


# ------------------------------------------------------------
# Wi-Fi Scan Mode
# ------------------------------------------------------------
# aggressive  → scans every ~4.5 seconds (faster discovery, more power use)
# powersaving → scans every ~12 seconds (slower, less power)

scanMode=aggressive


# ------------------------------------------------------------
# Speed Units (display only)
# ------------------------------------------------------------
# kmh → kilometers per hour
# mph → miles per hour

speedUnits=mph


# ------------------------------------------------------------
# battery Test
# ------------------------------------------------------------
#Values are True or False
#Will print seconds active when on battery power

batteryTest=false

# ------------------------------------------------------------
# Device Name
# ------------------------------------------------------------
# Optional.  Alphanumeric, hyphens and underscores only (max 20 chars).
# This value is appended to the WiGLE CSV header device field and
# prepended to the filename so multiple wardrivers uploading to the
# same account can be distinguished.
#
# Examples:
#   deviceName=rover1        -> device=Piglet-rover1       / rover1_Piglet_WiGLE_....csv
#   deviceName=backpack-2    -> device=Piglet-backpack-2   / backpack-2_Piglet_WiGLE_....csv
# Leave empty (or remove) for the default: device=Piglet-Wardriver

deviceName=


# ------------------------------------------------------------
# Board Type
# ------------------------------------------------------------
# Overrides automatic chip detection for pin mapping.
# auto = detect from chip model (default)
# s3   = XIAO ESP32-S3
# c5   = XIAO ESP32-C5 (required for 5 GHz scanning)
# c6   = XIAO ESP32-C6
# exp  = XIAO ESP32-S3 + Expansion Base
# Reboot required after changing.

board=auto


# ------------------------------------------------------------
# Mesh Mode On Boot
# ------------------------------------------------------------
# Automatically enter ESP-Now mesh mode after boot uploads complete.
# Bypasses the SoftAP window and jumps directly to the mesh page.
#
#   none = Normal wardriving mode (default)
#   core = Start as Mesh Core (coordinator) — logs data from nodes
#   node = Start as Mesh Node — forwards scan results to a Core
#          (compatible with Biscuit Pro and JCMK C5 Wardriver)

meshModeOnBoot=none


# ------------------------------------------------------------
# Screen Rotation
# ------------------------------------------------------------
# Rotate the display 180 degrees for upside-down mounting.
# Values: true or false
# Reboot required after changing.

rotateScreen180=false


# ------------------------------------------------------------
# BLE Wardriving (optional)
# ------------------------------------------------------------
# Passively scan for Bluetooth LE devices alongside Wi-Fi and log
# them to the same CSV with Type=BLE (WiGLE-1.6 format). When
# bleEnabled=false the BLE stack is never started — no flash/RAM cost.
# Reboot required after changing bleEnabled.

bleEnabled=false

# BLE scan-window duration in seconds. Range 1-10.
bleScanDuration=5

# Seconds between BLE scan windows. Forced to >= bleScanDuration + 5.
bleScanInterval=30

# Cap on the log-once dedupe rings (Wi-Fi + BLE) and the BLE pending-result
# queue (memory knob). Each MAC/BSSID is logged once until evicted past this
# cap. 100-2000; 200 matches the upstream JCMK/Biscuit mac_history.
bleMaxResults=200

# Log-once dedup master switch. true = each MAC/BSSID logged once per boot
# (Wi-Fi + BLE); false = log every sighting. Default true.
dedupEnabled=true


# ------------------------------------------------------------
# Save-file Blacklist (optional)
# ------------------------------------------------------------
# Networks/devices listed here are NEVER written to the CSV — useful for
# keeping your own home Wi-Fi or personal phones out of uploads. Matching is
# EXACT: a MAC matches on full address, an SSID/BLE-name on the whole string
# (case-insensitive). Up to 16 of each. The SSID list also filters BLE device
# names. Reboot to apply edits.
#
# One entry per line. MACs accept colons or bare 12-hex. Add an inline
# '# label' to note what each entry is (kept when the config is re-saved).
#
# blacklistMac=AA:BB:CC:DD:EE:FF    # My phone
# blacklistMac=112233445566         # Home router
# blacklistSsid=MyHomeNet           # Home network
# blacklistSsid=iPhone              # phone BLE name
