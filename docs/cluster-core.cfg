# Sample wardriver.cfg — Mesh CORE (the single controller / aggregator).
# Copy to /wardriver.cfg on the Core board's SD card.
#
# The Core does NOT scan BLE itself; it aggregates Wi-Fi + BLE forwarded by the
# Nodes and logs them with its OWN GPS. Attach the GPS module to the Core.
# Fill in wigleBasicToken / wdgwarsApiKey to auto-upload at boot.

board=c5
meshModeOnBoot=core

# Core uploads pending logs before entering mesh — needs home Wi-Fi + tokens.
homeSsid=YourHomeSSID
homePsk=YourHomePassword
wigleBasicToken=
wdgwarsApiKey=
maxBootUploads=-1

deviceName=piglet_core
scanMode=aggressive
speedUnits=mph
gpsBaud=9600

wardriverSsid=Piglet-WARDRIVE
wardriverPsk=wardrive1234

# BLE: the Core aggregates node BLE regardless of this flag. Leave false — it
# does not scan locally in this build; the OLED still shows the received count.
bleEnabled=false
bleScanDuration=5
bleScanInterval=30
bleDedupeWindow=300
bleMaxResults=500
