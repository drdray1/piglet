# Sample wardriver.cfg — Mesh CORE (the single controller / aggregator).
# Copy to /wardriver.cfg on the Core board's SD card.
#
# The Core does NOT scan BLE itself; it aggregates Wi-Fi + BLE forwarded by the
# Nodes and logs them with its OWN GPS. Attach the GPS module to the Core.
# Fill in wigleBasicToken / wdgwarsApiKey to auto-upload at boot.

board=c5
meshModeOnBoot=core

# Core uploads pending logs before entering mesh — needs home Wi-Fi + tokens.
homeSsid=YourHomeSSID
homePsk=YourHomePassword
wigleBasicToken=
wdgwarsApiKey=
maxBootUploads=-1

deviceName=piglet_core
scanMode=aggressive
speedUnits=mph
gpsBaud=9600

wardriverSsid=Piglet-WARDRIVE
wardriverPsk=wardrive1234

# BLE: the Core aggregates node BLE regardless of this flag. Leave false — it
# does not scan locally in this build; the OLED still shows the received count.
bleEnabled=false
bleScanDuration=5
bleScanInterval=30
bleMaxResults=200

# ---- Per-node scan roles ----
# Dedicate each node to a task by its FULL 12-hex MAC (no colons). The Core
# prints each node's MAC and a ready-to-paste line to Serial when it joins, e.g.:
#   [CORE]   add to /wardriver.cfg: node.A1B2C3D4E5F6=both
# Roles: wifi (Wi-Fi only), ble (BLE only), both (Wi-Fi + BLE).
# A node running PigletNode honors a ble/both role directly; a main-sketch node
# also needs bleEnabled=true in its own config to do BLE. Reboot the Core to
# apply edits (config is read once at boot).
nodeDefaultRole=both
# node.A1B2C3D4E5F6=wifi
# node.A1B2C3D4E5F7=ble

# ---- Save-file blacklist ----
# Networks/devices listed here are never written to the CSV (e.g. your own home
# Wi-Fi or phone). Enforced at write time on the Core, so it filters both local
# scans and everything forwarded in from nodes. Exact match: MAC = full address,
# SSID/BLE-name = whole string, case-insensitive. Up to 16 of each. The SSID list
# also matches BLE device names. Reboot to apply.
# One entry per line; MACs accept colons or bare 12-hex; inline '# label' is kept.
# blacklistMac=AA:BB:CC:DD:EE:FF    # My phone
# blacklistSsid=MyHomeNet           # Home network
