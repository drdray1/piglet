# ============================================================
# Piglet Waveshare C6 — STANDALONE wardriver
# ============================================================
# Device: Waveshare ESP32-C6 LCD 1.47"
# Role:   Standalone (the only supported role)
#
# Copy this file to the SD card as /wardriver.cfg (root of the card).
# Lines starting with '#' are comments. Unknown keys are ignored, so one file
# can be shared across devices. Most changes need a reboot.
#
# This port is Wi-Fi only: no mesh, no BLE, no blacklist, no dedup keys.
# The eight keys below are the complete set it understands.
# ============================================================

homeSsid=YourHomeSSID
homePsk=YourHomePassword

# WiGLE "Basic ..." token from https://wigle.net/account
wigleBasicToken=

wardriverSsid=Piglet-WARDRIVE
wardriverPsk=wardrive1234

# aggressive | powersaving
scanMode=aggressive
# mph | kmh
speedUnits=mph
gpsBaud=9600
