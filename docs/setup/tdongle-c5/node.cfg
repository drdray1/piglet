# ============================================================
# Piglet T-Dongle C5 — mesh NODE
# ============================================================
# Device: LilyGo T-Dongle C5
# Role:   Node (forwards to a Core)
#
# Copy this file to the SD card as /wardriver.cfg (root of the card).
# Lines starting with '#' are comments. Unknown keys are ignored, so one file
# can be shared across devices. Most changes need a reboot.
#
# A node skips STA, writes no CSV, and needs no GPS: the Core geotags
# everything. Its scan role (wifi/ble/both) comes from the Core.
#
# The T-Dongle has a fixed pinmap and no battery, so 'board', 'battPin' and
# 'batteryTest' do not apply here. Everything else matches the XIAO firmware.
# ============================================================

meshModeOnBoot=node

# ---- Basics ----
# deviceName appears in the CSV filename and the WiGLE header.
deviceName=dongle_node
# aggressive = scan every ~4.5s | powersaving = every ~12s
scanMode=aggressive
# mph | kmh
speedUnits=mph
gpsBaud=9600

# ---- BLE ----
# A node needs this true to honour a 'ble' or 'both' role from the Core.
# With bleEnabled=false the node can only ever do Wi-Fi, whatever role it is
# assigned. Reboot to apply.
bleEnabled=true
bleScanDuration=5
bleScanInterval=30

# Only used if the node drops out of mesh mode back into the web UI.
# ---- Wardriver AP (fallback when home Wi-Fi is unreachable) ----
# Connect to this and browse to http://192.168.4.1 for the web UI.
wardriverSsid=Piglet-WARDRIVE
wardriverPsk=wardrive1234
