# ============================================================
# Piglet — STANDALONE wardriver
# ============================================================
# Device: XIAO ESP32-S3 / C5 / C6 / C3
# Role:   Standalone (no mesh)
#
# Copy this file to the SD card as /wardriver.cfg (root of the card).
# Lines starting with '#' are comments. Unknown keys are ignored, so one file
# can be shared across devices. Most changes need a reboot.
# ============================================================

meshModeOnBoot=none

# auto | s3 | c5 | c6 | c3 | exp — 'auto' detects from the chip model.
board=auto

# ---- Basics ----
# deviceName appears in the CSV filename and the WiGLE header.
deviceName=piglet
# aggressive = scan every ~4.5s | powersaving = every ~12s
scanMode=aggressive
# mph | kmh
speedUnits=mph
gpsBaud=9600

# ---- Uploads (run once at boot, before wardriving starts) ----
# Leave homeSsid blank to skip the upload attempt entirely.
homeSsid=YourHomeSSID
homePsk=YourHomePassword

# WiGLE: "Basic ..." token from https://wigle.net/account (Show my token).
wigleBasicToken=
# WatchdogsGoWars: API key from https://wdgwars.pl
wdgwarsApiKey=

# -1 = upload everything, 0 = never auto-upload, 1-100 = cap per boot
maxBootUploads=-1

# ---- Wardriver AP (fallback when home Wi-Fi is unreachable) ----
# Connect to this and browse to http://192.168.4.1 for the web UI.
wardriverSsid=Piglet-WARDRIVE
wardriverPsk=wardrive1234

# Disconnect from home Wi-Fi right after uploads and start scanning.
autoStartAfterUpload=false

# Flip the OLED for an upside-down mount.
rotateScreen180=false

# Battery monitoring (board dependent). battPin=-1 disables.
battPin=-1
batteryTest=false

# ---- BLE wardriving (optional) ----
# Passive observer, never transmits. Logs Type=BLE rows into the same CSV.
# Requires NimBLE-Arduino. Reboot after changing bleEnabled.
bleEnabled=false
# Scan-window length, seconds (1-10). Wi-Fi scanning pauses during a window.
bleScanDuration=5
# Seconds between windows. Forced to >= bleScanDuration + 5.
bleScanInterval=30

# ---- Log-once dedup ----
# true  = each BSSID / BLE MAC written once per boot (default, compact CSVs)
# false = every sighting written (dwell-time / RSSI-over-time analysis)
dedupEnabled=true
# Dedup ring capacity, 100-2000. Also caps the BLE hand-off queue.
bleMaxResults=200

# ---- Save-file blacklist (optional) ----
# Never written to the CSV. Exact match, up to 16 of each; the SSID list also
# matches BLE device names. MACs accept colons or bare 12-hex; an inline
# '# label' is preserved when the config is re-saved. Reboot to apply.
# blacklistMac=AA:BB:CC:DD:EE:FF    # My phone
# blacklistSsid=MyHomeNet           # Home network
