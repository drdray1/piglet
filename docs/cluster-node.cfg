# Sample wardriver.cfg — Mesh NODE (scanning node, one per node board).
# Copy to /wardriver.cfg on each Node board's SD card.
#
# Nodes scan BOTH Wi-Fi (JCMK per-channel sweep) and BLE, then forward every
# observation to the Core over ESP-Now. Nodes skip STA and do not write CSVs or
# need GPS — the Core geotags and logs everything.

board=c5
meshModeOnBoot=node

scanMode=aggressive
speedUnits=mph
gpsBaud=9600

# Only used if the node drops out of mesh into the WebUI.
wardriverSsid=Piglet-WARDRIVE
wardriverPsk=wardrive1234

# BLE: enabled so the node scans and forwards BLE alongside Wi-Fi.
bleEnabled=true
bleScanDuration=5
bleScanInterval=30
bleDedupeWindow=300
bleMaxResults=500
