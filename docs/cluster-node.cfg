# Sample wardriver.cfg — Mesh NODE running the MAIN Piglet.ino in node mode.
# Copy to /wardriver.cfg on the Node board's SD card.
#
# NOTE: This file is ONLY for nodes running the main Piglet sketch with
# meshModeOnBoot=node. If your nodes run the dedicated PigletNode firmware
# (PigletNode/PigletNode.ino), they have NO config file — BLE is always on and
# there is nothing to copy. Use this file only for main-sketch nodes.
#
# Nodes scan BOTH Wi-Fi (JCMK per-channel sweep) and BLE, then forward every
# observation to the Core over ESP-Now. Nodes skip STA and do not write CSVs or
# need GPS — the Core geotags and logs everything.

board=c5
meshModeOnBoot=node

scanMode=aggressive
speedUnits=mph
gpsBaud=9600

# Only used if the node drops out of mesh into the WebUI.
wardriverSsid=Piglet-WARDRIVE
wardriverPsk=wardrive1234

# BLE: enabled so the node scans and forwards BLE alongside Wi-Fi.
# IMPORTANT: keep this true to let the Core assign this node a `ble` or `both`
# role. A main-sketch node with bleEnabled=false only ever scans Wi-Fi,
# regardless of the role the Core assigns (the NimBLE stack is never started).
bleEnabled=true
bleScanDuration=5
bleScanInterval=30
bleMaxResults=200
